<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="780" viewBox="0 0 1120 780" role="img" aria-labelledby="title desc">
<title id="title">原本を所有してから全必要pairを確定する</title><desc id="desc">Worldのbodyとplane、静的meshを一括copyし検証。最大8dynamic、16plane、4meshの必要188組と静的除外190組を区別する。readyは構造準備であり、非接触や応答の成功ではない。原著概念図で実測ではない。</desc>
<style>text{font-family:system-ui,'Yu Gothic',sans-serif;fill:#e6edf5} .small{font-size:17px;fill:#b7cbd9}.label{font-size:21px;font-weight:600}.box{fill:#142532;stroke:#426273;stroke-width:2}.line{fill:none;stroke:#69d2b0;stroke-width:3;marker-end:url(#arrow)}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#69d2b0"/></marker></defs>
<rect width="1120" height="780" fill="#0b1721"/><text x="42" y="54" font-size="29" font-weight="700">Worldと静的mesh：原本 → 検査 → 全必要pair</text>
<text x="42" y="87" class="small">Native prepare / SI・右手系 / 原著概念図（実測ではありません）</text>
<rect class="box" x="42" y="120" width="302" height="190" rx="12"/><text class="label" x="62" y="154">callerの原本</text><text class="small" x="62" y="189">World：全body・raw plane・gravity</text><text class="small" x="62" y="220">mesh：ID・revision・全vertices</text><text class="small" x="62" y="251">元配列順・負零・H・全settings</text><text class="small" x="62" y="282">同期capture中の並行変更は対象外</text>
<path class="line" d="M350 211H394"/><rect class="box" x="408" y="120" width="302" height="190" rx="12"/><text class="label" x="428" y="154">一括で別所有</text><text class="small" x="428" y="189">環境 → hard count → capture</text><text class="small" x="428" y="220">以後はsnapshotだけを読む</text><text class="small" x="428" y="251">completeでも入力不正を保持</text><text class="small" x="428" y="282">callerの編集・破棄から独立</text>
<path class="line" d="M717 211H762"/><rect class="box" x="776" y="120" width="302" height="190" rx="12"/><text class="label" x="796" y="154">全入力を再検証</text><text class="small" x="796" y="189">全body / raw plane条件</text><text class="small" x="796" y="220">共通collider ID・mesh内face ID</text><text class="small" x="796" y="251">finite域・上限・元ordinal</text><text class="small" x="796" y="282">失敗 → 一部一覧をreadyにしない</text>
<path class="line" d="M926 320V350H290V382"/>
<rect class="box" x="42" y="394" width="510" height="210" rx="12"/><text class="label" x="62" y="430">必要188組（最大入力の例）</text><text class="small" x="62" y="467">8dynamic × 4mesh = 32</text><text class="small" x="62" y="500">8dynamic × 16plane = 128</text><text class="small" x="62" y="533">body同士 C(8,2) = 28</text><text class="small" x="62" y="575">stable ID順 + typed元ordinal / revision</text>
<rect class="box" x="574" y="394" width="504" height="210" rx="12"/><text class="label" x="594" y="430">静的除外190組（同じ例）</text><text class="small" x="594" y="467">plane同士120 + plane×mesh64</text><text class="small" x="594" y="500">mesh同士6 / static bodyがあれば別会計</text><text class="small" x="594" y="533">188 + 190 = C(28,2) = 378</text><text class="small" x="594" y="575">除外は静的形状の非交差証明ではない</text>
<rect x="42" y="632" width="1036" height="106" rx="12" fill="#302a1e" stroke="#b99858"/><text class="label" x="62" y="667">readyは構造準備。衝突照会・伝播・候補・World更新は未実行。</text><text class="small" x="62" y="701">退化面も構造条件内ならreadyになり得る。全pair数値guard・接触応答は次の段で検証する。</text>
</svg>
