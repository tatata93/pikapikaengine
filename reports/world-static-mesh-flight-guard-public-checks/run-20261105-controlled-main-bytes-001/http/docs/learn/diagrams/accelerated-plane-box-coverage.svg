<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="750" viewBox="0 0 1120 750" role="img" aria-labelledby="title desc">
<title id="title">位置誤差と接触余裕を含む平面の全時間検査</title><desc id="desc">宣言された各軸誤差Bを加えた位置箱を平面式へ渡し、radiusとmarginを足した閾値との差を囲む。全閉時間leafの下限が正のときだけ条件付きで認証する。</desc>
<defs><style>text{font-family:system-ui,'Yu Gothic',sans-serif;fill:#e8eef8} .h{font-size:25px;font-weight:700}.s{font-size:19px}.n{font-size:16px}.box{fill:#18283f;stroke:#7695ba;stroke-width:2}.arrow{stroke:#a6bfdf;stroke-width:3;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#a6bfdf" stroke-width="1.5"/></marker></defs>
<rect width="1120" height="750" fill="#0a1425"/>
<text x="40" y="48" class="h">平面に触れないことを、位置の箱と全時間で確かめる</text>
<text x="40" y="80" class="n">原著の概念図。実測軌道・誤差量・性能のグラフではありません。</text>
<rect x="40" y="110" width="330" height="185" rx="12" class="box"/>
<text x="60" y="145" class="s">呼び出し側が明示する入力</text><text x="60" y="180" class="s">位置P・速度V・一定加速度a</text><text x="60" y="212" class="s">raw平面 n / offset・半径r</text><text x="60" y="244" class="s">各軸の誤差上限 B</text><text x="60" y="276" class="s">接触余裕 margin</text>
<path d="M380 205H425" class="arrow"/>
<rect x="440" y="110" width="640" height="185" rx="12" class="box"/>
<text x="460" y="145" class="s">閉じた時間区間 T の全位置を囲む</text><text x="460" y="182" class="s">Xk = Pk + Vk T + (ak / 2) T² + [−B, B]</text><text x="460" y="218" class="s">distance = ((nx Xx + ny Xy) + nz Xz) − offset</text><text x="460" y="253" class="s">threshold = r + margin ／ gap = distance − threshold</text><text x="460" y="279" class="n">外向き区間演算で、箱・距離・閾値・差をすべて保存</text>
<path d="M760 305V345" class="arrow"/>
<rect x="40" y="365" width="1040" height="170" rx="12" class="box"/>
<text x="60" y="400" class="s">[0, H] を欠けなく持つ ／ 分割点は両方の閉区間に含む</text>
<rect x="70" y="425" width="230" height="44" fill="#1c6654"/><rect x="300" y="425" width="180" height="44" fill="#1c6654"/><rect x="480" y="425" width="220" height="44" fill="#825e26"/><rect x="700" y="425" width="330" height="44" fill="#344259"/>
<text x="85" y="454" class="s">下限 &gt; 0</text><text x="315" y="454" class="s">下限 &gt; 0</text><text x="495" y="454" class="s">未認証</text><text x="715" y="454" class="s">未照会tailも残す</text>
<text x="60" y="510" class="s">全leafの下限が正のときだけ認証。zero・接線・狭い未知・予算不足は認証しない。</text>
<rect x="40" y="565" width="1040" height="145" rx="12" class="box"/>
<text x="60" y="600" class="s">この証拠の条件と、後続のWorld統合</text><text x="60" y="636" class="s">Bは宣言値。実中心の誤差証明・同じmargin・compiler規約との対応を別に検査する。</text><text x="60" y="671" class="s">球と平面のmetric証拠も必要。時間進行・接触応答・流体・材料損傷は後続。</text><text x="60" y="696" class="n">固定した演算順序の実数／binary64丸めを包含。任意再結合や全targetを認証する図ではない。</text>
</svg>
