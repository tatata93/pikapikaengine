<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc"><title id="title">波長分散と二種類の屈折率</title><desc id="desc">短い波長と長い波長で位相屈折率と屈折方向が異なる模式図。群屈折率は位相屈折率とその波長微分から求める。</desc><rect width="1000" height="360" rx="16" fill="#101a28"/><g font-family="sans-serif" font-size="21" fill="#e1eaf5"><text x="30" y="38">波長が変わる → n(λ)が変わる → 同じ面でも曲がり方が変わる</text><rect x="245" y="75" width="235" height="235" fill="#243e55"/><path d="M65 85L245 195" stroke="#fff" stroke-width="4" fill="none"/><path d="M245 195L455 257" stroke="#73c9ff" stroke-width="4" fill="none"/><path d="M245 195L455 282" stroke="#fb9f58" stroke-width="4" fill="none"/><path d="M135 195H475" stroke="#94a3b8" stroke-dasharray="7 6"/><text x="65" y="120">入射</text><text x="275" y="110">合成の分散材質</text><text x="310" y="240" fill="#73c9ff">短い波長</text><text x="300" y="308" fill="#fb9f58">長い波長</text><text x="540" y="110">位相屈折率 n(λ)</text><text x="540" y="150">Snell則の屈折方向に使う</text><text x="540" y="215">群屈折率 ng = n − λ dn/dλ</text><text x="540" y="255">群遅延を考えるときに使う</text><text x="540" y="315" font-size="17" fill="#aab9cb">模式図。実在の材質・屈折角・測定値ではない。</text></g></svg>
