<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="title desc"><title id="title">球の根、レンズ面の選別、tと距離</title><desc id="desc">左図は裏側から入る光線で近根が頂点側ではないため除外され遠根を採用する。右図は方向ベクトルの長さ2でtが1m、物理距離が2mとなる。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#66d8c1"/></marker></defs><rect width="900" height="400" rx="12" fill="#0b1722"/><g font-family="system-ui,sans-serif" fill="#e2edf6"><text x="30" y="38" font-size="23">球全体から、使うレンズ面を選ぶ</text><circle cx="270" cy="205" r="125" stroke="#668099" stroke-dasharray="7 7" fill="none" stroke-width="2"/><path d="M171 128A125 125 0 0 0 171 282" fill="none" stroke="#70bfff" stroke-width="6"/><path d="M171 112V298" stroke="#70bfff" stroke-dasharray="3 6"/><path d="M470 205H115" stroke="#66d8c1" stroke-width="3" marker-end="url(#arrow)"/><circle cx="395" cy="205" r="7" fill="#e2edf6"/><circle cx="145" cy="205" r="8" fill="#ffad66"/><text x="352" y="170" font-size="17">近根: 裏の半球</text><text x="354" y="252" font-size="16">→ 除外</text><text x="32" y="170" font-size="16">頂点側の</text><text x="32" y="191" font-size="16">遠根を採用</text><text x="30" y="350" font-size="17">さらに円形開口の内側かを確認する</text><path d="M515 60V365" stroke="#30475b"/><text x="550" y="90" font-size="22">P(t) = O + t·d</text><path d="M560 195H838" stroke="#66d8c1" stroke-width="3" marker-end="url(#arrow)"/><circle cx="560" cy="195" r="6" fill="#e2edf6"/><path d="M820 145V245" stroke="#70bfff" stroke-width="4"/><circle cx="820" cy="195" r="7" fill="#ffad66"/><text x="550" y="150" font-size="17">O</text><text x="600" y="237" font-size="17">|d| = 2（無次元）</text><text x="550" y="290" font-size="19">t = 1 m</text><text x="550" y="322" font-size="19">物理距離 = t·|d| = 2 m</text><text x="550" y="359" font-size="15" fill="#afc2d5">区間が未確定なら、点の成功値を返さない</text></g></svg>
