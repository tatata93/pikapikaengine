<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
<title id="title">加速する球の入口を時間の幅で囲む</title><desc id="desc">中心Yが3−2t²で下がる球。下端がY=0になる解析時刻は1秒。緑のsafe prefixは分離を証明した時間。橙のbracketでは正の左端と負の右端から入口の存在を確認する。説明のためbracket幅を拡大した概念図。</desc>
<rect width="900" height="360" rx="10" fill="#0d1723"/>
<g font-family="sans-serif"><text x="28" y="35" fill="#e6edf5" font-size="23">加速する軌道を、時間の区間で調べる</text><text x="28" y="64" fill="#afc2d5" font-size="16">自作の概念図 / 球は接触後も指定軌道を継続 / 応答なし</text></g>
<rect x="88" y="180" width="693" height="107" fill="#302829"/><path d="M88 90V287H800M88 180H781" stroke="#60758a" stroke-width="2"/>
<path d="M90 120Q435 120 780 280" fill="none" stroke="#7ed5f6" stroke-width="4"/>
<path d="M90 140Q435 140 780 300" fill="none" stroke="#4c8594" stroke-width="2" stroke-dasharray="5 5"/>
<path d="M435 94V288" stroke="#ffbf75" stroke-width="2" stroke-dasharray="5 4"/><circle cx="435" cy="160" r="5" fill="#7ed5f6"/>
<g font-family="sans-serif" font-size="16" fill="#afc2d5"><text x="30" y="116">Y [m]</text><text x="70" y="125">3</text><text x="69" y="184">0</text><text x="87" y="309">0</text><text x="428" y="309">1</text><text x="774" y="309">2</text><text x="803" y="291">t [s]</text><text x="130" y="104" fill="#7ed5f6">中心 Y=3−2t²</text><text x="120" y="165" fill="#ffbf75">球の下端が平面へ</text><text x="620" y="206" fill="#ffbf75">平面の固体側</text></g>
<rect x="90" y="327" width="690" height="12" fill="#344355"/><rect x="90" y="327" width="330" height="12" fill="#7ee1d1"/><rect x="420" y="323" width="30" height="20" fill="#ffbf75"/>
<g font-family="sans-serif" font-size="16"><text x="190" y="353" fill="#7ee1d1">分離を証明したprefix</text><text x="470" y="353" fill="#ffbf75">入口bracket（幅は拡大表示）</text></g>
</svg>
