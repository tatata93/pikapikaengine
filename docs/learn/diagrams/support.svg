<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc"><title id="title">荷重を支える反力と接触の運動学</title><desc id="desc">下から1kg2kg3kgの球にY荷重5Nマイナス4N7N、重力10m毎秒毎秒。反力52N47N23N。球対では相対接線速度による中心距離の二階微分を含める。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#80edc1"/></marker></defs><rect width="1000" height="360" rx="16" fill="#101a28"/><g font-family="sans-serif" fill="#e1eaf5" font-size="21"><text x="28" y="36">保持荷重を含む3段の支持</text><g stroke="#9ed8ff" fill="#24577c" stroke-width="2"><circle cx="170" cy="282" r="37"/><circle cx="170" cy="208" r="37"/><circle cx="170" cy="134" r="37"/></g><path d="M65 320H440" stroke="#718da5" stroke-width="3"/><g stroke="#80edc1" stroke-width="3" marker-end="url(#arrow)"><path d="M220 320V285"/><path d="M220 245V210"/><path d="M220 171V136"/></g><text x="260" y="304">52 N</text><text x="260" y="229">47 N</text><text x="260" y="155">23 N</text><text x="25" y="285">1 kg</text><text x="25" y="211">2 kg</text><text x="25" y="137">3 kg</text><text x="28" y="74" font-size="17">重力10m/s²、保持荷重Y: 下から5, −4, 7N</text><text x="520" y="36">中心間距離の二階微分</text><circle cx="625" cy="244" r="50" stroke="#9ed8ff" fill="#526478"/><circle cx="625" cy="144" r="50" stroke="#9ed8ff" fill="#24577c"/><path d="M625 144H750" stroke="#80edc1" stroke-width="3" marker-end="url(#arrow)"/><text x="760" y="150">u_t</text><path d="M625 144V244" stroke="#afc2d5" stroke-dasharray="6 5"/><text x="645" y="208">d</text><text x="525" y="319">a_gap = N·(aB−aA) + |u_t|²/d</text></g></svg>
