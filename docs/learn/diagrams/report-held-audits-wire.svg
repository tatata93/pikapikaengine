<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="550" viewBox="0 0 1040 550">
<title>監査行の全項目と区画の所属をそのまま取り出す</title>
<desc>任意配列と任意列挙値の有無を区別し、全区間端点と行の計算差分、区画の元の所属indexを保持する原著概念図。</desc>
<defs><style>text{font-family:system-ui,sans-serif;fill:#183248}.title{font-size:26px;font-weight:700}.head{font-size:21px;font-weight:700}.body{font-size:18px}.small{font-size:16px}</style></defs>
<rect width="1040" height="550" rx="16" fill="#f1f6fa"/>
<text x="30" y="46" class="title">監査行の全項目と、区画の元の所属を残す</text>
<text x="30" y="78" class="small">原著の取得概念図。新2型22項目 / 合計49型287項目。全held ResultとReportは後続です。</text>
<rect x="30" y="108" width="475" height="245" rx="14" fill="#e5efff" stroke="#b8cbdf"/>
<text x="50" y="145" class="head">CellAudit · 18項目</text>
<text x="50" y="184" class="body">全3軸 / 区間の両端 / 原時刻</text>
<text x="50" y="222" class="body">12 optional / enumはenum tag</text>
<text x="50" y="260" class="body">行のWork差分を集計へ置換しない</text>
<text x="50" y="305" class="small">present内の配列と、その有無を区別</text>
<text x="50" y="333" class="small">未照会や未返却を成功で補わない</text>
<rect x="530" y="108" width="480" height="245" rx="14" fill="#e5f5ec" stroke="#b0d2c0"/>
<text x="550" y="145" class="head">PartitionLeaf · 4項目</text>
<text x="550" y="184" class="body">Cell / state / blocked_reason</text>
<text x="550" y="222" class="body">audit indexなしと0は別</text>
<text x="550" y="260" class="body">元indexは全64bitで保存</text>
<text x="550" y="305" class="small">未解決理由を取り除かない</text>
<text x="550" y="333" class="small">全行・全区画の容器はResultで後続</text>
<rect x="30" y="380" width="980" height="137" rx="14" fill="white" stroke="#c5d3dd"/>
<text x="50" y="417" class="head">保存済み値を独立比較</text>
<text x="50" y="454" class="body">14人工監査行 + 4区画 / 12optionalの任意2項目の264組合せ</text>
<text x="50" y="489" class="small">人工診断の取得図です。実モデルの計測・証明や、全4096有無組合せの実行図ではありません。</text>
</svg>
