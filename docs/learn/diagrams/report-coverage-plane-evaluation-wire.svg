<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="550" viewBox="0 0 1040 550" role="img" aria-labelledby="title desc">
<title id="title">plane boxのEvaluationを保存する</title><desc id="desc">3軸のtube区間、distance、threshold、gapの各区間を独立に取得する。下端と上端、原順を保持し、取得時に演算しない。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#6ce1ce"/></marker></defs>
<rect width="1040" height="550" rx="20" fill="#101b2b"/>
<g font-family="sans-serif" fill="#edf5ff"><text x="36" y="47" font-size="27" font-weight="700">計算済みの区間を、計算し直さず保存する</text><text x="36" y="79" font-size="16" fill="#b9cadf">原著の保存範囲の概念図 · 人工Evaluationの保存検証であり、実軌道の認証図ではありません</text></g>
<g fill="#20334b" stroke="#416284" stroke-width="1.5"><rect x="36" y="112" width="350" height="282" rx="12"/><rect x="475" y="112" width="240" height="282" rx="12"/><rect x="804" y="112" width="200" height="282" rx="12"/></g>
<g font-family="sans-serif" fill="#edf5ff" font-size="18"><text x="55" y="146" font-size="21" font-weight="700">Evaluation · 全4項目</text><text x="55" y="190" fill="#6ce1ce">tube_coordinates</text><text x="55" y="222">x [下端, 上端]</text><text x="55" y="255">y [下端, 上端]</text><text x="55" y="288">z [下端, 上端]</text><text x="55" y="334" fill="#ffcf91">distance / threshold / gap</text><text x="55" y="367" font-size="16">それぞれ保存済みの [下端, 上端]</text><text x="495" y="146" font-size="21" font-weight="700">const getter</text><text x="495" y="190">全3軸・元の順序</text><text x="495" y="232">全6区間・全12端点</text><text x="495" y="275">各fieldを独立に取得</text><text x="495" y="325" fill="#6ce1ce">再減算・再queryなし</text><text x="495" y="367" font-size="16">送信済みprefixを保持</text><text x="822" y="146" font-size="21" font-weight="700">独立仕様</text><text x="822" y="192">原byteと型を比較</text><text x="822" y="233">順序・個数も検査</text><text x="822" y="282" fill="#6ce1ce">同値の交換は</text><text x="822" y="314" fill="#6ce1ce">拒否数と分ける</text><text x="822" y="367" font-size="16">数値認証とは区別</text></g>
<g stroke="#6ce1ce" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M386 252H465"/><path d="M715 252H794"/></g>
<rect x="36" y="422" width="968" height="85" rx="12" fill="#153a3a" stroke="#3c8f83"/><g font-family="sans-serif" fill="#d5fff3" font-size="18"><text x="55" y="455" font-weight="700">人工sourceのIntervalは、既存public constructorだけで作る</text><text x="55" y="486" font-size="16">下端零 -0 / 上端 +0 は既存の構築契約 · Interval TUは試験専用 · 製品に演算を追加しない</text></g>
</svg>
