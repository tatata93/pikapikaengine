<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-labelledby="title desc"><title id="title">1tickの衝撃と原状保持</title><desc id="desc">一定荷重をすべての自由区間へ保持し、時間と空間のguard内で早期に応答する。安全な残時間をすべて進めればcommitし、支持や予算が未解決なら元stateと荷重へ戻る。gapと時間bracketは説明用に拡大した自作の概念図。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#afc2d5"/></marker></defs><rect width="900" height="380" rx="12" fill="#0d1723"/><g font-family="system-ui,'Yu Gothic',sans-serif"><text x="30" y="34" fill="#e6edf5" font-size="21">保持荷重 → 自由区間 → 早期衝撃 → 残時間</text><text x="30" y="61" fill="#afc2d5" font-size="14">概念図。時間幅・正のgapは拡大。描画は数値証明ではありません。</text><g fill="#13293a" stroke="#39566b"><rect x="30" y="90" width="170" height="100" rx="8"/><rect x="240" y="90" width="180" height="100" rx="8"/><rect x="460" y="90" width="180" height="100" rx="8"/><rect x="680" y="90" width="190" height="100" rx="8"/></g><g fill="#e6edf5" font-size="16"><text x="48" y="119">初期state・荷重</text><text x="257" y="119">分離を証明して進む</text><text x="477" y="119">guard内で衝撃</text><text x="697" y="119">残区間も全bodyで</text></g><g fill="#7ee1d1" font-size="15"><text x="48" y="149">F, τ を保持</text><text x="257" y="149">丸めを包含</text><text x="477" y="149">位置投影なし</text><text x="697" y="149">同じ相手も再照会</text></g><g fill="#afc2d5" font-size="13"><text x="48" y="173">t = 0</text><text x="257" y="173">連続区間の証明</text><text x="477" y="173">entryは時刻の幅で返す</text><text x="697" y="173">荷重はまだ消費しない</text></g><g stroke="#afc2d5" fill="none" marker-end="url(#arrow)"><path d="M205 140H233"/><path d="M425 140H453"/><path d="M645 140H673"/><path d="M775 199V231"/><path d="M450 205V310H210V205"/></g><rect x="670" y="238" width="200" height="80" rx="8" fill="#12332f" stroke="#7ee1d1"/><text x="689" y="267" fill="#7ee1d1" font-size="18">全区間成功 → commit</text><text x="689" y="294" fill="#e6edf5" font-size="14">荷重消費・時計更新</text><rect x="30" y="240" width="380" height="60" rx="8" fill="#30271f" stroke="#ffbf75"/><text x="48" y="265" fill="#ffbf75" font-size="17">未解決・支持・予算不足 → tick全体を戻す</text><text x="48" y="287" fill="#e6edf5" font-size="13">位置・姿勢・速度・角運動量・荷重・時計を保持</text><text x="30" y="351" fill="#afc2d5" font-size="14">W1は球と静的平面の有限精度参照。持続支持・任意形状・実機精度の完成ではありません。</text></g></svg>
