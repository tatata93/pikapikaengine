<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="550" viewBox="0 0 1040 550">
<title>候補監査と幾何結果の全要素を取得する</title>
<desc>CandidateAuditの全KKT slotとGeometryの全区間配列、ID、mask、relationを変換せずに取得する原著概念図。</desc>
<defs><style>text{font-family:system-ui,sans-serif;fill:#183248}.title{font-size:26px;font-weight:700}.head{font-size:21px;font-weight:700}.body{font-size:18px}.small{font-size:16px}</style></defs>
<rect width="1040" height="550" rx="16" fill="#f1f6fa"/>
<text x="30" y="46" class="title">候補監査と幾何結果を、欠落なく取得する</text>
<text x="30" y="78" class="small">原著の取得概念図。新2型17項目 / 合計34型193項目。全Result・全Reportは未完です。</text>
<rect x="30" y="108" width="310" height="210" rx="14" fill="#e5efff" stroke="#b8cbdf"/>
<text x="48" y="145" class="head">候補監査 · 5項目</text>
<text x="48" y="183" class="body">feature / disposition</text>
<text x="48" y="220" class="body">barycentricの全3成分</text>
<text x="48" y="257" class="body">KKTの全2slot / count</text>
<text x="48" y="290" class="small">count=0でも配列を切り詰めない</text>
<rect x="365" y="108" width="310" height="210" rx="14" fill="#e5f5ec" stroke="#b0d2c0"/>
<text x="383" y="145" class="head">幾何結果 · 12項目</text>
<text x="383" y="183" class="body">full64 ID / U32特徴mask</text>
<text x="383" y="220" class="body">全6組の3成分区間配列</text>
<text x="383" y="257" class="body">距離系の3区間 / relation</text>
<text x="383" y="290" class="small">maskを一意featureへ直さない</text>
<rect x="700" y="108" width="310" height="210" rx="14" fill="#fff0de" stroke="#ddc39e"/>
<text x="718" y="145" class="head">元の区間端点を保持</text>
<text x="718" y="183" class="body">中点や代替normalを作らない</text>
<text x="718" y="220" class="body">追加照会・演算・確保なし</text>
<text x="718" y="257" class="body">原順・型・全bitを取得</text>
<text x="718" y="290" class="small">人工診断による取得検証4件</text>
<rect x="30" y="344" width="980" height="173" rx="14" fill="white" stroke="#c5d3dd"/>
<text x="50" y="380" class="head">実MSVC Release / Debugの有限検証</text>
<text x="50" y="417" class="body">全3241 byte一致 / F64 104・負零6 / 旧5種類の全byteを保持</text>
<text x="50" y="451" class="body">1080停止・例外 / 1080再入拒否 / 254 byte改変＋3record改変拒否</text>
<text x="50" y="487" class="small">取得試験用の人工診断です。球・三角形queryの実行や物理的な有効性の受入とは別です。</text>
</svg>
