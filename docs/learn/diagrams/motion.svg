<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc"><title id="title">骨の原本キーと世界姿勢</title><desc id="desc">骨IDと親IDを保つ原本から、絶対時刻の局所TRSを補間し、親worldと子localを掛けて世界姿勢を得る。結果を原本へ書き戻さない。</desc><rect width="1000" height="360" rx="16" fill="#101c2b"/><g font-family="system-ui,sans-serif" fill="#e6edf5" font-size="19"><text x="24" y="35">編集する原本 → 時刻tの局所姿勢 → 階層の世界行列 → joint表示</text><g stroke="#42566d" fill="#16283c"><rect x="25" y="73" width="250" height="195" rx="10"/><rect x="337" y="73" width="290" height="195" rx="10"/></g><text x="45" y="108">bone ID / parent ID</text><text x="45" y="147">key: time / p / q / scale</text><path d="M54 203H246" stroke="#a9baff" stroke-width="3"/><g fill="#a9baff"><circle cx="65" cy="203" r="7"/><circle cx="150" cy="203" r="7"/><circle cx="235" cy="203" r="7"/></g><text x="45" y="248">保存・Undo/Redo</text><text x="357" y="110">local = T R S</text><text x="357" y="153">world = parent × local</text><text x="357" y="198">step / linear / NLERP</text><text x="357" y="241">同じtなら同じ姿勢</text><path d="M280 170H326M635 170H678" stroke="#ffbf75" stroke-width="4"/><g stroke="#7ee1d1" stroke-width="7" fill="#101c2b"><path d="M708 259L708 179L794 139L877 171" fill="none"/><circle cx="708" cy="259" r="10"/><circle cx="708" cy="179" r="10"/><circle cx="794" cy="139" r="10"/><circle cx="877" cy="171" r="10"/></g><text x="704" y="104">共通C++のFK</text><text x="704" y="303">表示結果は原本と別</text><path d="M25 322H975" stroke="#42566d"/><text x="26" y="350" font-size="16">非一様scaleのshearはworld行列に保持。スキニング・IK・接触物理は別の機能。</text></g></svg>
