<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="550" viewBox="0 0 1040 550">
<title>保持荷重の全入力と計算記録をそのまま取り出す</title>
<desc>原順の三角形と全入力、設定、実計数と予約上限を独立して保持する原著概念図。</desc>
<defs><style>text{font-family:system-ui,sans-serif;fill:#183248}.title{font-size:26px;font-weight:700}.head{font-size:21px;font-weight:700}.body{font-size:18px}.small{font-size:16px}</style></defs>
<rect width="1040" height="550" rx="16" fill="#f1f6fa"/>
<text x="30" y="46" class="title">元の入力と、返された計算記録を別々に残す</text>
<text x="30" y="78" class="small">原著の取得概念図。新2型15項目 / 合計43型247項目。全Reportと物理進行APIは後続です。</text>
<rect x="30" y="108" width="475" height="245" rx="14" fill="#e5efff" stroke="#b8cbdf"/>
<text x="50" y="145" class="head">Snapshot · 4項目</text>
<text x="50" y="184" class="body">元のHeldSphere / 秒のhorizon</text>
<text x="50" y="222" class="body">全triangles / 入れ子settings</text>
<text x="50" y="260" class="body">空・元順・重複・頂点逆順も保存</text>
<text x="50" y="305" class="small">力/質量/重力を加速度へまとめない</text>
<text x="50" y="333" class="small">形状や設定の有効性は別の判断</text>
<rect x="530" y="108" width="480" height="245" rx="14" fill="#e5f5ec" stroke="#b0d2c0"/>
<text x="550" y="145" class="head">held::Work · 11項目</text>
<text x="550" y="184" class="body">照会・候補・平方根の10計数 → U64</text>
<text x="550" y="222" class="body">実回数 / 予約上限 / exactのbool</text>
<text x="550" y="260" class="body">差分と集計を取得時に合算しない</text>
<text x="550" y="305" class="small">guard::Work / HeldLedgerとは別型</text>
<text x="550" y="333" class="small">上限を実測値へ置き換えない</text>
<rect x="30" y="380" width="980" height="137" rx="14" fill="white" stroke="#c5d3dd"/>
<text x="50" y="417" class="head">取得の独立比較</text>
<text x="50" y="454" class="body">人工Snapshot 3件 + Work 2件 / 全F64 bit・整数・flag・原順</text>
<text x="50" y="489" class="small">数学照会や時間窓認証の実行図ではありません。取得処理は数値モデルを呼びません。</text>
</svg>
