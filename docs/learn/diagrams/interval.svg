<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-labelledby="t d">
<title id="t">区間に零が含まれない場合と含まれる場合</title><desc id="d">上段の区間2から4には零がないため、その区間内の値は零にならない。下段の区間マイナス1から2には零が含まれるが、実際の値が零になることまでは分からない。</desc>
<rect width="900" height="320" rx="10" fill="#0d1723"/>
<g font-family="sans-serif" fill="#e6edf5"><text x="30" y="35" font-size="23">値が入る範囲を外側から囲む</text><text x="30" y="65" font-size="17" fill="#afc2d5">自作の概念図 / 丸め幅と区間の計算過程は省略</text></g>
<path d="M80 130H820M80 235H820" stroke="#60758a" stroke-width="2"/>
<path d="M320 90V267" stroke="#fff" stroke-width="2" stroke-dasharray="6 5"/>
<g fill="#afc2d5" font-family="sans-serif" font-size="17"><text x="311" y="285">0</text><text x="191" y="263">−1</text><text x="551" y="263">2</text><text x="551" y="159">2</text><text x="791" y="159">4</text></g>
<path d="M560 130H800" stroke="#7ee1d1" stroke-width="12"/><circle cx="560" cy="130" r="7" fill="#7ee1d1"/><circle cx="800" cy="130" r="7" fill="#7ee1d1"/>
<path d="M200 235H560" stroke="#ffbf75" stroke-width="12"/><circle cx="200" cy="235" r="7" fill="#ffbf75"/><circle cx="560" cy="235" r="7" fill="#ffbf75"/>
<g font-family="sans-serif" font-size="19"><text x="355" y="107" fill="#7ee1d1">零を含まない → 零になる可能性を除外できる</text><text x="100" y="205" fill="#ffbf75">零を含む → 根があるかは、まだ分からない</text></g>
</svg>
