<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="550" viewBox="0 0 1040 550" role="img" aria-labelledby="title desc">
<title id="title">球同士と球・平面の選択をvariant境界で残す</title><desc id="desc">ordinal0はSpherePair、1はSpherePlane。値なしを別の型に修復せず、何も追加出力しない拒否へ渡す。</desc>
<rect width="1040" height="550" rx="18" fill="#f1f6fa"/><g font-family="sans-serif" fill="#213b4a">
<text x="30" y="47" font-size="24" font-weight="bold">Inputの選択とchildを、variant境界ごと残す</text><text x="30" y="78" font-size="16">既存62record型369項目 ＋ variant 1型 / 原著の保存範囲の概念図</text>
<rect x="30" y="110" width="475" height="220" rx="15" fill="#e6eeff" stroke="#c4d2df"/><text x="50" y="148" font-size="21" font-weight="bold">variant ordinal 0 → SpherePair</text><text x="50" y="192" font-size="18">first / secondを元の順で保存</text><text x="50" y="232" font-size="18">入力(A,B)と(B,A)を区別する</text><text x="50" y="272" font-size="18">開始 → child取得 → endのStatusを確認</text>
<rect x="530" y="110" width="480" height="220" rx="15" fill="#e4f4ec" stroke="#c4d9cf"/><text x="550" y="148" font-size="21" font-weight="bold">variant ordinal 1 → SpherePlane</text><text x="550" y="192" font-size="18">sphere / planeの全係数を保存</text><text x="550" y="232" font-size="18">法線の正規化や半径膨張をしない</text><text x="550" y="272" font-size="18">ordinalとchildの交換も検出する</text>
<rect x="30" y="360" width="980" height="155" rx="15" fill="white" stroke="#c4d2df"/><text x="50" y="398" font-size="20" font-weight="bold">値なし → reject_invalid_value() / 追加0byte・0callback</text><text x="50" y="438" font-size="17">variant_nposを切り詰めず、ordinal0・null・既定値へ修復しない。</text><text x="50" y="478" font-size="16">実targetの到達性は別測定。Snapshot・全Report・物理進行APIへの接続は後続。</text></g></svg>
