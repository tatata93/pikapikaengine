<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="550" viewBox="0 0 1040 550">
<title>保持荷重の全結果を元入力と未照会領域も含めて保存する</title>
<desc>全25項目の原値を取得し、証明島、区画とtail、未照会frontier、全監査行と集計を区別する原著概念図。</desc>
<defs><style>text{font-family:system-ui,sans-serif;fill:#183248}.title{font-size:26px;font-weight:700}.head{font-size:21px;font-weight:700}.body{font-size:18px}.small{font-size:16px}</style></defs>
<rect width="1040" height="550" rx="16" fill="#f1f6fa"/>
<text x="30" y="46" class="title">元入力・全証拠・未照会領域をまとめて残す</text>
<text x="30" y="78" class="small">原著の取得概念図。Result全25項目 / 合計50型312項目。最上位Reportと物理進行APIは後続です。</text>
<rect x="30" y="108" width="475" height="245" rx="14" fill="#e5efff" stroke="#b8cbdf"/>
<text x="50" y="145" class="head">元入力と全証拠</text>
<text x="50" y="184" class="body">snapshot / body / 全3軸の元値</text>
<text x="50" y="222" class="body">初期証明 / 全証明島 / witness / 窓</text>
<text x="50" y="260" class="body">safe prefixなしと[0,0]は別</text>
<text x="50" y="305" class="small">力から加速度や証拠を作り直さない</text>
<text x="50" y="333" class="small">全候補IDの原順・重複も保持</text>
<rect x="530" y="108" width="480" height="245" rx="14" fill="#e5f5ec" stroke="#b0d2c0"/>
<text x="550" y="145" class="head">全区画・全監査と集計</text>
<text x="550" y="184" class="body">partition / frontier / current / audits</text>
<text x="550" y="222" class="body">tailと証拠時刻より後の領域も保存</text>
<text x="550" y="260" class="body">last meshと所属index / 全message</text>
<text x="550" y="305" class="small">行のWork差分とResult集計は別</text>
<text x="550" y="333" class="small">未照会を成功や再queryで補わない</text>
<rect x="30" y="380" width="980" height="137" rx="14" fill="white" stroke="#c5d3dd"/>
<text x="50" y="417" class="head">保持荷重13型98項目の取得対応</text>
<text x="50" y="454" class="body">15人工Result / 13optionalの任意2項目312組合せ / 全原値比較</text>
<text x="50" y="489" class="small">診断の保存範囲を示す図です。実モデルの認証、全8192組合せや性能の測定図ではありません。</text>
</svg>
