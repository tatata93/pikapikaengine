<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="550" viewBox="0 0 1040 550" role="img" aria-labelledby="title desc">
<title id="title">pair coverageの全Resultを保存する</title><desc id="desc">入力、結果flag、全監査行、全区画、未照会frontierとcurrent、全計数と本文を独立に保存する。途中失敗では送信済みprefixを保持する。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#6ce1ce"/></marker></defs>
<rect width="1040" height="550" rx="20" fill="#101b2b"/>
<g font-family="sans-serif" fill="#edf5ff"><text x="36" y="47" font-size="27" font-weight="700">全Resultを、そのまま残す</text><text x="36" y="79" font-size="16" fill="#b9cadf">人工診断の保存範囲の概念図 · 数値モデルの認証・性能測定ではありません</text></g>
<g fill="#20334b" stroke="#416284" stroke-width="1.5"><rect x="36" y="112" width="360" height="114" rx="12"/><rect x="36" y="244" width="360" height="150" rx="12"/><rect x="36" y="412" width="360" height="95" rx="12"/><rect x="495" y="153" width="214" height="226" rx="12"/><rect x="790" y="112" width="214" height="282" rx="12"/></g>
<g font-family="sans-serif" fill="#edf5ff" font-size="17"><text x="55" y="142" font-weight="700">元入力・保存済み分類</text><text x="55" y="174">snapshot / status / reason</text><text x="55" y="204">validated / failed_input / complete</text><text x="55" y="274" font-weight="700">すべての行・区画・保留中の情報</text><text x="55" y="307">audits / partition / frontier</text><text x="55" y="339">current なし ≠ 値あり</text><text x="55" y="371" fill="#6ce1ce">元の順序・重複・未照会tailを保持</text><text x="55" y="443" font-weight="700">work / message</text><text x="55" y="476">全64bit計数 / 全length・本文byte</text><text x="517" y="190" font-size="21" font-weight="700">const getter</text><text x="517" y="231">全12項目を取得</text><text x="517" y="266">再queryなし</text><text x="517" y="301">補完・修復なし</text><text x="517" y="343" fill="#6ce1ce">v1 型付きbyte列</text><text x="809" y="145" font-weight="700">独立した仕様と照合</text><text x="809" y="188">全child / 全配列</text><text x="809" y="222">optional / variant</text><text x="809" y="256">enum / 本文</text><text x="809" y="302" fill="#6ce1ce">人工17 Result</text><text x="809" y="336">実モデルの生成とは</text><text x="809" y="365">区別して検証する</text></g>
<g stroke="#6ce1ce" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M396 169H446V220H485"/><path d="M396 317H485"/><path d="M396 457H446V351H485"/><path d="M709 266H780"/></g>
<rect x="495" y="412" width="509" height="95" rx="12" fill="#382a30" stroke="#c58889"/><g font-family="sans-serif" fill="#ffe1df" font-size="17"><text x="515" y="444" font-weight="700">途中で値を取得できなくなった場合</text><text x="515" y="477">送信済みprefixを保持 · 完成文書として公開しない</text></g>
</svg>
