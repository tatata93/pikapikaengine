<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="550" viewBox="0 0 1040 550">
<title>安全区間と侵入証拠を保存された値のまま取り出す</title>
<desc>初期点と区画の証明、侵入証拠、秒の入口窓を区別し、区間の全端点と元の監査indexを保持する原著概念図。</desc>
<defs><style>text{font-family:system-ui,sans-serif;fill:#183248}.title{font-size:26px;font-weight:700}.head{font-size:21px;font-weight:700}.body{font-size:18px}.small{font-size:16px}</style></defs>
<rect width="1040" height="550" rx="16" fill="#f1f6fa"/>
<text x="30" y="46" class="title">安全区間と侵入証拠を、所属情報と一緒に残す</text>
<text x="30" y="78" class="small">原著の取得概念図。新4型18項目 / 合計47型265項目。全held ResultとReportは後続です。</text>
<rect x="30" y="108" width="475" height="245" rx="14" fill="#e5efff" stroke="#b8cbdf"/>
<text x="50" y="145" class="head">InitialProof / CertifiedLeaf</text>
<text x="50" y="184" class="body">初期点の下側・上側の証明</text>
<text x="50" y="222" class="body">証明済みCellと下側の証明</text>
<text x="50" y="260" class="body">区間の全端点 / 元audit index</text>
<text x="50" y="305" class="small">getterで軌道や区間を再計算しない</text>
<text x="50" y="333" class="small">人工recordの保存と物理認証は別</text>
<rect x="530" y="108" width="480" height="245" rx="14" fill="#e5f5ec" stroke="#b0d2c0"/>
<text x="550" y="145" class="head">Witness / EntryWindow</text>
<text x="550" y="184" class="body">証拠時刻 / 経路箱 / anchor / 誤差</text>
<text x="550" y="222" class="body">秒の両端と幅 / 全3軸の原順</text>
<text x="550" y="260" class="body">実際の上側証明 / 元audit index</text>
<text x="550" y="305" class="small">時間幅[秒]と経路の広がり[m]は別</text>
<text x="550" y="333" class="small">箱の幅の下端 ≠ 物理的変位の下限</text>
<rect x="30" y="380" width="980" height="137" rx="14" fill="white" stroke="#c5d3dd"/>
<text x="50" y="417" class="head">保存済み値を独立参照へ</text>
<text x="50" y="454" class="body">各型2件の人工診断 / 両端・時刻・全軸・全64bit indexを比較</text>
<text x="50" y="489" class="small">実モデルの証明・運動・性能を示す測定図ではありません。数値照会は行いません。</text>
</svg>
