<svg xmlns="http://www.w3.org/2000/svg" width="960" height="800" viewBox="0 0 960 800" role="img" aria-labelledby="title desc">
<title id="title">初期証拠、開始窓、全被覆、診断の所属を分けて読む</title>
<desc id="desc">定義線分のentry windowには初期点strict正、closed安全prefix、E補正strict負witness、外向き幅とexact Workが必要。説明用parameter帯でprefix、開始窓、証明島、未照会tailを分離する。全256audit、128partitionとfrontier、64sourceと保守IDを保持する。閲覧auditと最後のmeshの所属は別であり、任意anchorを厳密path点としない。全所有JSONへ符号零を保存し編集で旧結果を消す。図の長さと番号は測定結果ではない。</desc>
<rect width="960" height="800" rx="16" fill="#101d29"/>
<g font-family="system-ui,sans-serif" fill="#e6edf5">
<text x="28" y="42" font-size="25">開始窓の証拠と、残っている領域を一緒に読む</text>
<text x="28" y="74" font-size="18" fill="#b0c3d5">定義線分 p(s) ／ s・幅は無次元 ／ 物理TOI・World・応答は求めない</text>
<rect x="28" y="94" width="904" height="136" rx="10" fill="#162a39" stroke="#385267"/>
<text x="47" y="124" font-size="21" fill="#7ee1d1">entry_window：四つの証拠を揃える</text>
<g font-size="18"><text x="47" y="158">① 初期 g(0) &gt; 0</text><text x="450" y="158">② closed [0,L] 全体が strict 正</text>
<text x="47" y="189">③ U に E 補正済み strict 負witness</text><text x="450" y="189">④ 外向き幅上端 ≤ tol / exact Work</text></g>
<text x="47" y="215" font-size="16" fill="#b0c3d5">負点だけの未認証、初期貫通、全経路の離隔は、それぞれ別の結果</text>
<rect x="28" y="248" width="904" height="180" rx="10" fill="#162a39" stroke="#385267"/>
<text x="47" y="279" font-size="20">全 [0,1] を保持：後方の証明島へ prefix を飛ばさない</text>
<path d="M67 315H893" stroke="#68829c" stroke-width="2"/>
<path d="M67 315H297" stroke="#7ee1d1" stroke-width="10"/>
<rect x="297" y="302" width="120" height="26" fill="#6a3c4a" stroke="#ffacb4"/>
<path d="M417 315H527M737 315H893" stroke="#9eb2c7" stroke-width="7" stroke-dasharray="8 5"/>
<path d="M527 315H737" stroke="#8db9ff" stroke-width="10"/>
<circle cx="67" cy="315" r="7" fill="#ffe0b8"/>
<path d="M417 298V333" stroke="#ffacb4" stroke-width="3"/>
<g font-size="17"><text x="60" y="353">0</text><text x="129" y="353" fill="#7ee1d1">prefix</text><text x="289" y="353">L</text><text x="407" y="353">U</text><text x="576" y="353" fill="#8db9ff">証明島</text><text x="789" y="353">tail</text><text x="888" y="353">1</text></g>
<g font-size="17"><text x="47" y="386">初期点</text><text x="264" y="386" fill="#ffacb4">窓 / 負witness</text><text x="526" y="386">未知域と未照会は残す</text></g>
<text x="47" y="412" font-size="16" fill="#b0c3d5">safePrefix:null と [0,0] は別 ／ 全partition・current・frontierは数値欄で確認</text>
<rect x="28" y="446" width="435" height="180" rx="10" fill="#162a39" stroke="#385267"/>
<text x="47" y="478" font-size="21">選択audit ／ 初期点込み最大256</text>
<g font-size="18"><text x="47" y="513">kind / cell / parameter / outcome</text><text x="47" y="545">path・point bounds / R・E / delta Work</text><text x="47" y="577" fill="#ffbf75">任意anchor ≠ 厳密なpath点</text></g>
<text x="47" y="607" font-size="16" fill="#b0c3d5">row_failure祖先は子の成功へ書き換えない</text>
<rect x="489" y="446" width="443" height="180" rx="10" fill="#20353b" stroke="#72bdb8"/>
<text x="508" y="478" font-size="21">lastMesh ／ 最後の所属auditのみ</text>
<g font-size="18"><text x="508" y="513">全64source・実row・全候補prefix</text><text x="508" y="545">保守ID集合 ≠ 瞬間nearest ID</text><text x="508" y="577" fill="#ffbf75">別auditへ幾何・statusを移さない</text></g>
<text x="508" y="607" font-size="16" fill="#b0c3d5">未照会 / null query / 失敗を省略しない</text>
<rect x="28" y="644" width="904" height="128" rx="10" fill="#29282d" stroke="#bb9c77"/>
<text x="47" y="676" font-size="20">全128partition・証明島・tail・原入力を所有JSONへ</text>
<text x="47" y="707" font-size="18">−0とoptional保持 ／ Workのdelta・総計・保守upperを分ける</text>
<text x="47" y="736" font-size="18">編集で旧結果を即消去 ／ 閲覧・説明投影だけでは再queryしない</text>
<text x="47" y="760" font-size="15" fill="#c0b3a5">原著概念図。帯の幅・番号は実結果や精度の測定ではない。UI受入は別に検証する。</text>
</g>
</svg>
