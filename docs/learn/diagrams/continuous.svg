<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="t d"><title id="t">高速球の終点検査と途中の接触時刻</title><desc id="d">開始ではAがBの左に離れている。2ミリ秒後に接触。8.333ミリ秒の終点ではAがBを通過して右で離れている。終点検査だけでは途中の接触を見落とす。</desc><rect width="900" height="300" rx="10" fill="#0d1723"/><g font-family="sans-serif" font-size="19" fill="#e6edf5"><text x="35" y="35">開始: 離れている</text><text x="325" y="35">途中: 接触する</text><text x="610" y="35">終点: 再び離れている</text></g><g stroke="#304d64" fill="none"><path d="M25 143H285M315 143H575M605 143H875"/><path d="M300 60V260M590 60V260" stroke-dasharray="4 5"/></g><g stroke-width="3"><circle cx="75" cy="143" r="18" stroke="#7ee1d1" fill="#204d57"/><circle cx="183" cy="143" r="18" stroke="#ffbf75" fill="#513c2d"/><circle cx="417" cy="143" r="18" stroke="#7ee1d1" fill="#204d57"/><circle cx="453" cy="143" r="18" stroke="#ffbf75" fill="#513c2d"/><circle cx="635" cy="143" r="18" stroke="#ffbf75" fill="#513c2d"/><circle cx="827" cy="143" r="18" stroke="#7ee1d1" fill="#204d57"/></g><path d="M105 143H148" stroke="#7ee1d1" stroke-width="3"/><path d="M158 143l-12-7v14Z" fill="#7ee1d1"/><circle cx="435" cy="143" r="5" fill="#fff"/><g fill="#e6edf5" font-family="sans-serif" font-size="18"><text x="68" y="150">A</text><text x="176" y="150">B</text><text x="410" y="150">A</text><text x="446" y="150">B</text><text x="628" y="150">B</text><text x="820" y="150">A</text><text x="48" y="213">t = 0 ms</text><text x="363" y="213">TOI = 2 ms</text><text x="640" y="213">t = 8.333… ms</text><text x="35" y="270" fill="#afc2d5">A: 1000 m/s / 両球の半径0.5m / 開始の中心距離3m / 衝突後も同じ直線を進めた比較</text></g><path d="M435 181V194" stroke="#fff"/><text x="375" y="240" fill="#fff" font-family="sans-serif" font-size="16">区間内を調べる</text></svg>
