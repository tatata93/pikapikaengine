<svg xmlns="http://www.w3.org/2000/svg" width="800" height="260" viewBox="0 0 800 260" role="img" aria-labelledby="t d"><title id="t">距離による音の遅れと減衰</title><desc id="d">10メートルで約29.2ミリ秒、20メートルで約58.3ミリ秒。距離2倍で音圧振幅半分、強度4分の1。</desc><rect width="800" height="260" rx="10" fill="#0d1723"/><g fill="none" stroke="#2d6274" stroke-width="2"><circle cx="95" cy="115" r="45"/><path d="M95 15a100 100 0 0 1 0 200M95 2a175 175 0 0 1 140 213"/></g><circle cx="95" cy="115" r="15" fill="#ffbf75"/><path d="M115 115H715" stroke="#afc2d5" stroke-width="2" stroke-dasharray="5 5"/><g fill="#7ee1d1"><rect x="372" y="101" width="25" height="28"/><rect x="692" y="101" width="25" height="28"/></g><g font-family="sans-serif" font-size="18" fill="#e6edf5"><text x="55" y="160">音源</text><text x="330" y="65">受聴点 A</text><text x="650" y="65">受聴点 B</text><text x="310" y="160">10m / 29.2ms</text><text x="590" y="160">20m / 58.3ms</text><text x="270" y="207">Aに対する音圧振幅: 1 → 1/2</text><text x="270" y="237">Aに対する強度: 1 → 1/4</text><text x="28" y="32" font-size="16">仮定: c = 343m/s</text></g></svg>
