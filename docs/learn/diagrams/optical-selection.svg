<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc"><title id="title">複数面から一意な最近傍を選ぶ</title><desc id="desc">候補面までの閉prefix全体で奥の不確定面がmissなら、その面を候補より前から除外できる。手前の不確定面や重なる交点区間は無視せず選択を保留する。</desc><rect width="1000" height="360" rx="12" fill="#0d1723"/><g font-family="system-ui,sans-serif" fill="#e6edf5"><text x="28" y="38" font-size="22">不確定な面を無視せず、最近傍を選ぶ</text><text x="28" y="66" font-size="16" fill="#afc2d5">面ごとの交点区間と、候補までの閉じた領域を比較する。</text><g stroke-width="3"><path d="M65 145H930" stroke="#526b82"/><path d="M430 100V190" stroke="#7ee1d1"/><path d="M795 100V190" stroke="#ffbf75" stroke-dasharray="8 6"/><path d="M65 210H445" stroke="#7ee1d1"/></g><rect x="415" y="126" width="30" height="38" rx="3" fill="#24577c" stroke="#7ee1d1" stroke-width="2"/><circle cx="65" cy="145" r="6" fill="#d7e6f6"/><text x="45" y="105" font-size="17">原点</text><text x="355" y="92" font-size="17" fill="#7ee1d1">候補A：全族hit</text><text x="715" y="92" font-size="17" fill="#ffbf75">面B：元照会は未確定</text><text x="110" y="242" font-size="17" fill="#7ee1d1">閉prefix [tMin, Aのt上端]</text><text x="495" y="215" font-size="17">Bがこの全領域でmiss → A以前から除外</text><path d="M28 268H972" stroke="#2c4157"/><text x="28" y="301" font-size="18" fill="#ffbf75">手前に未確定面がある / 順序の箱が重なる / 予算で未照会</text><text x="28" y="332" font-size="17">証拠が足りなければ選択なし。ID順や代表光線だけでは決めない。</text></g></svg>
