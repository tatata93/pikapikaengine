<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc"><title id="title">支持・衝撃・離脱を含む一つのtick</title><desc id="desc">支持区間を小さく区切り、途中の衝撃と離脱を処理する。各候補軌道の全区間を監査し、失敗時はtick全体を戻す。</desc><rect width="1000" height="360" rx="12" fill="#0d1723"/><g font-family="system-ui,sans-serif" fill="#e6edf5"><text x="30" y="40" font-size="22">支える区間と、接触が変わる瞬間</text><text x="30" y="70" font-size="16" fill="#afc2d5">1 tick = 1/120 秒。図の時間幅と曲がりは概念表示。</text><path d="M50 130H940" stroke="#68829c" stroke-width="3"/><g fill="#24577c" stroke="#7ee1d1" stroke-width="2"><rect x="50" y="110" width="190" height="40" rx="5"/><rect x="250" y="110" width="170" height="40" rx="5"/><rect x="440" y="110" width="160" height="40" rx="5"/><rect x="620" y="110" width="150" height="40" rx="5"/><rect x="790" y="110" width="150" height="40" rx="5"/></g><g font-size="17" text-anchor="middle"><text x="145" y="138">支持を保つ</text><text x="335" y="138">支持を保つ</text><text x="520" y="138">接触を更新</text><text x="695" y="138">離脱</text><text x="865" y="138">自由な運動</text></g><path d="M430 90V170" stroke="#ffbf75" stroke-width="4"/><text x="430" y="195" font-size="17" text-anchor="middle" fill="#ffbf75">衝撃：速度を変更</text><g stroke="#7ee1d1" stroke-width="2" fill="none"><path d="M55 255Q140 215 235 255"/><path d="M255 255Q335 215 415 255"/><path d="M445 255Q525 215 595 255"/><path d="M625 255Q700 215 765 255"/><path d="M795 255Q865 215 935 255"/></g><text x="30" y="290" font-size="17">各候補放物線の途中も監査 → 全区間が許容帯内の場合だけ進める</text><text x="30" y="325" font-size="17" fill="#ffbf75">失敗：そのtickの状態・荷重・時計を保持。予算変更後も同じWorldで再試行。</text></g></svg>
