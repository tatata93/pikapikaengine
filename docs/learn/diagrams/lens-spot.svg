<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc"><title id="title">幾何スポットと波長のラベル</title><desc id="desc">等面積の瞳標本を合成両凸レンズへ送り、センサー位置区間を波長ごとに比較する。色は波長ラベルで明るさではなく、未解決や未実行をゼロへ置換しない。</desc><rect width="1000" height="360" rx="12" fill="#0d1723"/><g font-family="system-ui,sans-serif" fill="#e6edf5"><text x="28" y="38" font-size="22">瞳の標本 → 合成レンズ → センサー位置の包含</text><text x="28" y="67" font-size="16" fill="#afc2d5">有限の幾何標本の比較。回折像・輝度画像・校正済みレンズではない。</text><path d="M330 100Q275 180 330 260Q385 180 330 100Z" fill="#24415d" stroke="#9db7d3" stroke-width="2"/><path d="M60 180H650M620 90V270" fill="none" stroke="#526b82" stroke-width="2"/><g fill="none" stroke-width="2"><path d="M65 120H320L620 186M65 240H320L620 174" stroke="#a9baff"/><path d="M65 145H310L620 180M65 215H310L620 180" stroke="#7ee1d1"/><path d="M65 100H330L620 166M65 260H330L620 194" stroke="#ffbf75"/></g><text x="55" y="292" font-size="17">同じ瞳節点・同じ重みを全波長で使う</text><text x="565" y="292" font-size="17">センサーZを変更</text><rect x="710" y="99" width="255" height="180" rx="6" fill="#121e2c" stroke="#526b82"/><path d="M728 190H948M837 114V263" fill="none" stroke="#405a72"/><g fill="none" stroke-width="2"><rect x="822" y="154" width="9" height="8" stroke="#a9baff"/><rect x="846" y="207" width="8" height="9" stroke="#a9baff"/><rect x="831" y="183" width="9" height="8" stroke="#7ee1d1"/><rect x="810" y="207" width="9" height="8" stroke="#ffbf75"/><rect x="850" y="155" width="9" height="8" stroke="#ffbf75"/></g><text x="730" y="92" font-size="17">XYの位置箱・表示中央値</text><text x="28" y="332" font-size="17" fill="#ffbf75">未知の標本は0や黒へ置換しない。色は450 / 550 / 650nmのラベル。</text></g></svg>
