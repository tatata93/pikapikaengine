<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="550" viewBox="0 0 1040 550" role="img" aria-labelledby="title desc">
<title id="title">Snapshotの元入力・時間幅・設定を分けて保存する</title><desc id="desc">inputの選択、秒のhorizon、設定の原値を保持する。値なしchildで途中失敗した場合、送信済みprefixを取り消さない。</desc>
<rect width="1040" height="550" rx="18" fill="#f1f6fa"/><g font-family="sans-serif" fill="#213b4a">
<text x="30" y="47" font-size="24" font-weight="bold">Snapshot：元入力・時間幅・設定をそのまま残す</text><text x="30" y="78" font-size="16">63record型372項目 ＋ variant 1型 / 原著の保存範囲の概念図</text>
<rect x="30" y="110" width="310" height="220" rx="15" fill="#e6eeff" stroke="#c4d2df"/><text x="50" y="148" font-size="22" font-weight="bold">1. input</text><text x="50" y="192" font-size="18">ordinal 0 / 1とchild</text><text x="50" y="232" font-size="18">元の係数・名前・順序</text><text x="50" y="272" font-size="17">値なしを既定値に直さない</text>
<rect x="365" y="110" width="310" height="220" rx="15" fill="#e4f4ec" stroke="#c4d9cf"/><text x="385" y="148" font-size="22" font-weight="bold">2. horizon</text><text x="385" y="192" font-size="18">元の時間幅［秒］</text><text x="385" y="232" font-size="18">binary64の全bitを保持</text><text x="385" y="272" font-size="17">正の時間への修復をしない</text>
<rect x="700" y="110" width="310" height="220" rx="15" fill="#fff0dc" stroke="#d8cdbb"/><text x="720" y="148" font-size="22" font-weight="bold">3. settings</text><text x="720" y="192" font-size="18">元の許容時間幅と件数</text><text x="720" y="232" font-size="18">U64件数・U32深さ</text><text x="720" y="272" font-size="17">既定値への置換をしない</text>
<rect x="30" y="360" width="980" height="155" rx="15" fill="white" stroke="#c4d2df"/><text x="50" y="398" font-size="20" font-weight="bold">途中失敗：送信済みobject / input keyを保持する</text><text x="50" y="438" font-size="17">getter・Writer・finish・complete・transportを確認して公開する。</text><text x="50" y="478" font-size="16">原値の保存 ≠ モデルの入力認証。全Report・物理進行APIは後続。</text></g></svg>
