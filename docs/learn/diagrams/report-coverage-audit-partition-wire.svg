<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="550" viewBox="0 0 1040 550" role="img" aria-labelledby="title desc">
<title id="title">接触計算の監査行と区画を原値で保存する</title><desc id="desc">試行flagと値の有無、失敗理由、区画の状態と所属先を別々に保存する。欠けた値を区間で補わない。</desc>
<rect width="1040" height="550" rx="18" fill="#f1f6fa"/><g font-family="sans-serif" fill="#213b4a">
<text x="30" y="47" font-size="24" font-weight="bold">監査と区画：未返却・失敗・所属先も残す</text><text x="30" y="78" font-size="16">67record型389項目 ＋ variant 1型 / 原著の保存範囲の概念図</text>
<rect x="30" y="110" width="475" height="220" rx="15" fill="#e6eeff" stroke="#c4d2df"/><text x="50" y="148" font-size="22" font-weight="bold">Audit：計算を試みた記録</text><text x="50" y="192" font-size="18">call_attemptedとvalueの有無を分ける</text><text x="50" y="232" font-size="18">元のInterval両端・分類・失敗理由</text><text x="50" y="272" font-size="18">split_timeなしと負零の秒を区別</text>
<rect x="530" y="110" width="480" height="220" rx="15" fill="#e4f4ec" stroke="#c4d9cf"/><text x="550" y="148" font-size="22" font-weight="bold">PartitionLeaf：区画の所属</text><text x="550" y="192" font-size="18">元のCellとstate / blocked_reason</text><text x="550" y="232" font-size="18">audit_indexの「なし」と0を区別</text><text x="550" y="272" font-size="18">親の監査位置と所属先を分ける</text>
<rect x="30" y="360" width="980" height="155" rx="15" fill="white" stroke="#c4d2df"/><text x="50" y="398" font-size="20" font-weight="bold">欠けた値をwhole / zero区間で補わない</text><text x="50" y="438" font-size="17">未知のenumと全64bitの位置を保持し、取得時に再queryしない。</text><text x="50" y="478" font-size="16">人工診断の保存試験。全Result・全Report・物理進行APIは後続。</text></g></svg>
