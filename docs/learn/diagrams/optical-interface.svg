<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-labelledby="t d"><title id="t">単一平面での反射・屈折とパワー配分</title><desc id="d">上半分が入射媒質、下半分が透過媒質。法線は上向き。入射は左上から境界へ、反射は右上、屈折は右下へ進む。屈折率1から1.5の方向例。臨界付近で判定できない値は未確定のままにする。</desc><defs><marker id="i" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7ee1d1"/></marker><marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#ffbf75"/></marker><marker id="u" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8bc7ff"/></marker><marker id="n" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#b3c6d8"/></marker></defs><rect width="900" height="380" rx="10" fill="#0d1723"/><path d="M30 200H530V355H30Z" fill="#162e41"/><path d="M30 200H530" stroke="#a4c5dc" stroke-width="2"/><path d="M320 200V52" stroke="#b3c6d8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#n)"/><path d="M224 72L320 200" stroke="#7ee1d1" stroke-width="4" marker-end="url(#i)"/><path d="M320 200L416 72" stroke="#ffbf75" stroke-width="4" marker-end="url(#r)"/><path d="M320 200L384 346.64" stroke="#8bc7ff" stroke-width="4" marker-end="url(#u)"/><circle cx="320" cy="200" r="4" fill="#fff"/><path d="M320 150A50 50 0 0 0 290 160" fill="none" stroke="#7ee1d1" stroke-width="2"/><g fill="#e6edf5" font-family="sans-serif" font-size="18"><text x="45" y="36">入射媒質 nᵢ = 1</text><text x="45" y="235">透過媒質 nₜ = 1.5</text><text x="153" y="83" fill="#7ee1d1">入射 i</text><text x="425" y="83" fill="#ffbf75">反射</text><text x="402" y="325" fill="#8bc7ff">屈折</text><text x="332" y="41">法線 n</text><text x="264" y="136" fill="#7ee1d1">θᵢ</text><text x="47" y="182">平面界面</text></g><g fill="#afc2d5" font-family="sans-serif" font-size="17"><text x="560" y="42">原入力: i=(3,−4,0), n=(0,1,0)</text><text x="560" y="84">反射: (0.6, 0.8, 0)</text><text x="560" y="120">屈折: (0.4, −√21/5, 0)</text><text x="560" y="166">方向とパワー配分は別々に確認。</text><text x="560" y="201">s / p / 無偏光のRとTを比較する。</text></g><rect x="548" y="235" width="327" height="100" rx="7" fill="#292322"/><g fill="#ffe0b8" font-family="sans-serif" font-size="17"><text x="563" y="265">臨界の符号を確定できなければ、</text><text x="563" y="295">屈折・R/Tは「未確定」。</text><text x="563" y="322">0%や透過成功に置き換えない。</text></g><text x="560" y="364" fill="#afc2d5" font-family="sans-serif" font-size="15">独自作図 / 矢印の長さや色は光量ではない</text></svg>
