<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc"><title id="title">有限packetのワット数を指定経路ごとに運ぶ</title><desc id="desc">単色ソースPをN等分したpacketが両凸レンズへ入射。主透過T前T後と内部反射T前R後R前T後を独立に理想センサーへ照会し、未解決があれば最終集計を作らない。</desc><rect width="1000" height="400" rx="16" fill="#101c2b"/><g font-family="system-ui,sans-serif" fill="#e6edf5" font-size="19"><text x="24" y="35">各λは独立なP W実験 → 各packetはP/N W → 経路ごとに集計</text><path d="M330 76Q280 175 330 275Q380 175 330 76Z" fill="#233e57" stroke="#a9baff" stroke-width="3"/><path d="M78 128L312 128L346 133L670 176" fill="none" stroke="#7ee1d1" stroke-width="4"/><path d="M78 228L317 228L345 219L312 189L345 163L670 102" fill="none" stroke="#ffbf75" stroke-width="3"/><path d="M670 75V290" stroke="#d2deed" stroke-width="6"/><g stroke="#d2deed" fill="#101c2b"><rect x="660" y="164" width="20" height="23"/><rect x="658" y="92" width="24" height="20"/></g><text x="64" y="96">有限packet</text><text x="78" y="265">I=P/N、Q/U/VもW</text><text x="395" y="213" fill="#7ee1d1">主透過 T → T</text><text x="388" y="114" fill="#ffbf75">内部反射 T → R → R → T</text><text x="700" y="113">理想センサー</text><text x="700" y="147">実位置区間とW</text><text x="700" y="184">追加のcos掛けなし</text><text x="700" y="221">二経路を自動加算しない</text><path d="M25 310H975" stroke="#42566d"/><text x="26" y="342">全packetが既知 → 経路ごとの検出POWER区間</text><text x="26" y="376" fill="#ffbf75">未解決・未実行あり → 最終集計なし。0Wや再正規化で補わない。</text></g></svg>
