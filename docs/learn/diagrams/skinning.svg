<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc"><title id="title">骨の変換を混ぜて頂点を動かす</title><desc id="desc">原本の頂点と重みを保持し、rest inverseと現在の骨行列から変換を作り、正規化した重みで混ぜる。rest姿勢なら元の位置へ戻る。物理的な損傷とは別の計算。</desc><rect width="960" height="360" rx="16" fill="#111d29"/><g fill="#e1edf5" font-family="system-ui,sans-serif" font-size="18"><text x="24" y="36">原本の頂点 p と骨ID・重み</text><text x="357" y="36">骨ごとの変換</text><text x="697" y="36">変形した位置 p′</text></g><g fill="#1c3040" stroke="#68cbb8" stroke-width="2"><rect x="24" y="65" width="260" height="180" rx="10"/><rect x="350" y="65" width="260" height="180" rx="10"/><rect x="676" y="65" width="260" height="180" rx="10"/></g><g fill="#e1edf5" font-family="system-ui,sans-serif" font-size="19"><text x="44" y="107">頂点 p [m]</text><text x="44" y="147">骨7 : 重み1</text><text x="44" y="183">骨19 : 重み3</text><text x="44" y="219">原本は書き換えない</text><text x="370" y="107">現在 G × rest逆行列 I</text><text x="370" y="150">重みは 1/4 と 3/4 へ</text><text x="370" y="186">作業用に正規化</text><text x="370" y="221">行列を混ぜて p に適用</text><text x="698" y="111">p′ = (Σ w G I) p</text><text x="698" y="158">rest なら G I ≈ 単位行列</text><text x="698" y="204">IDで対応、順序は任意</text></g><g stroke="#f4bd76" stroke-width="3" fill="none"><path d="M292 148h46m-10-9 10 9-10 9M618 148h46m-10-9 10 9-10 9"/></g><g fill="#a8becd" font-family="system-ui,sans-serif" font-size="17"><text x="24" y="286">位置だけの線形ブレンド。特異な変形・反転・体積の減少が起こり得ます。</text><text x="24" y="319">原著の概念図。物理的な弾性・塑性・破壊や、GPU描画の検証結果ではありません。</text></g></svg>
