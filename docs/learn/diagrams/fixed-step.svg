<svg xmlns="http://www.w3.org/2000/svg" width="800" height="260" viewBox="0 0 800 260" role="img" aria-labelledby="t d"><title id="t">固定刻みと描画の分離</title><desc id="d">シミュレーションは等間隔、描画は不等間隔。描画時には直前と現在の位置を補間する。</desc><rect width="800" height="260" rx="10" fill="#0d1723"/><g font-family="sans-serif" font-size="18" fill="#e6edf5"><text x="24" y="50">世界を進める</text><text x="24" y="120">画面を描く</text><text x="24" y="195">位置を補間</text><text x="220" y="238">前の位置 p₀ → 中間 p → 現在 p₁</text></g><g stroke="#38526b" stroke-width="2"><path d="M205 48H760M205 118H760"/></g><g stroke="#7ee1d1" stroke-width="5"><path d="M230 30V67M300 30V67M370 30V67M440 30V67M510 30V67M580 30V67M650 30V67M720 30V67"/></g><g fill="#e6edf5"><circle cx="248" cy="118" r="7"/><circle cx="353" cy="118" r="7"/><circle cx="418" cy="118" r="7"/><circle cx="543" cy="118" r="7"/><circle cx="640" cy="118" r="7"/><circle cx="740" cy="118" r="7"/></g><path d="M260 187H675" stroke="#7ee1d1" stroke-width="3"/><circle cx="260" cy="187" r="11" fill="#7ee1d1"/><circle cx="675" cy="187" r="11" fill="#7ee1d1"/><path d="M457 173l14 14-14 14-14-14Z" fill="#ffbf75"/><text x="280" y="88" fill="#afc2d5" font-family="sans-serif" font-size="16">一定の dt [s]</text></svg>
