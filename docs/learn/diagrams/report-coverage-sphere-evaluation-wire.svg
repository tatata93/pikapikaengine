<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="570" viewBox="0 0 1040 570" role="img" aria-labelledby="title desc">
<title id="title">球間距離Evaluationの全9項目を元値のまま保存</title><desc id="desc">二つの球と差分の各3軸区間、二乗距離のrawと非負化後、平方根の全戻り値、保存されたdistance、threshold、gapを区別する概念図。人工保存試験であり数値モデルの認証ではない。</desc>
<rect width="1040" height="570" rx="20" fill="#101c2c"/>
<g font-family="sans-serif" fill="#edf5ff">
<text x="32" y="45" font-size="25" font-weight="700">球間距離の全9項目を、再計算せず保存する</text>
<text x="32" y="78" font-size="16" fill="#bdd1e8">原著の保存範囲の概念図 ／ 人工Evaluationの保存試験であり、数値モデルの認証ではない</text>
<rect x="28" y="106" width="984" height="110" rx="15" fill="#193049" stroke="#719bc6"/>
<text x="49" y="142" font-size="22" font-weight="700">球1の3軸 ／ 球2の3軸 ／ 差分の3軸</text>
<text x="49" y="181" font-size="18">first_coordinates ／ second_coordinates ／ delta：原順と全端点を保持</text>
<rect x="28" y="237" width="476" height="165" rx="15" fill="#173c3e" stroke="#86bdb7"/>
<rect x="525" y="237" width="487" height="165" rx="15" fill="#26364c" stroke="#719bc6"/>
<text x="49" y="274" font-size="22" font-weight="700">二乗距離は二つの保存値</text>
<text x="49" y="314" font-size="18">raw_squared_distance</text><text x="49" y="349" font-size="18">nonnegative_squared_distance</text><text x="49" y="382" font-size="16" fill="#bdd1e8">取得時にclamp・置換しない</text>
<text x="547" y="274" font-size="22" font-weight="700">rootとdistanceも別の保存値</text>
<text x="547" y="314" font-size="18">root：区間・反復数・制限到達flag</text><text x="547" y="349" font-size="18">distance ／ threshold ／ gap</text><text x="547" y="382" font-size="16" fill="#bdd1e8">元のコピーが不整合でも上書きしない</text>
<rect x="28" y="423" width="984" height="117" rx="15" fill="#292e48"/>
<text x="49" y="459" font-size="21" font-weight="700">正当なpublic Interval構築と、人工データの保存を区別</text>
<text x="49" y="494" font-size="17" fill="#bdd1e8">NaN区間・反転区間を偽造しない。零の正規化は既存constructorの契約。</text>
<text x="49" y="524" font-size="17" fill="#bdd1e8">最上位World Report・C API pump・WASM／ゲーム接続は後続。</text>
</g></svg>
