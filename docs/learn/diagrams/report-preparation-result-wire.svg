<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<rect width="1280" height="720" fill="#0a1424"/>
<g font-family="Yu Gothic,Meiryo,sans-serif" fill="#eaf3ff">
<text x="48" y="65" font-size="32" font-weight="700">準備結果を、理由と元データごと保存する</text>
<text x="48" y="105" font-size="19" fill="#adc4dd">Resultの7項目。状態から内容を推定せず、所有値をそのまま取得する。</text>
<rect x="48" y="145" width="365" height="407" rx="18" fill="#142740" stroke="#4b799c"/>
<rect x="457" y="145" width="365" height="407" rx="18" fill="#142740" stroke="#4b799c"/>
<rect x="866" y="145" width="365" height="407" rx="18" fill="#142740" stroke="#4b799c"/>
<text x="72" y="192" font-size="24" fill="#82d8ff" font-weight="700">状態と理由</text>
<text x="72" y="244" font-size="21">status / reason / capture</text>
<text x="72" y="292" font-size="19">元の型付きordinalを保存</text>
<text x="72" y="337" font-size="19">未知の値も読み替えない</text>
<text x="72" y="407" font-size="19">ready・partial・失敗を</text>
<text x="72" y="441" font-size="19">データの有無と独立に保持</text>
<text x="481" y="192" font-size="24" fill="#a5e5b8" font-weight="700">3個のoptional</text>
<text x="481" y="244" font-size="21">failure / snapshot / inventory</text>
<text x="481" y="292" font-size="19">欠損と存在を区別</text>
<text x="481" y="337" font-size="19">全値・元配列順・重複を保持</text>
<text x="481" y="407" font-size="19">存在する空配列と欠損は別</text>
<text x="481" y="441" font-size="19">元の組合せを補正しない</text>
<text x="890" y="192" font-size="24" fill="#ffd28e" font-weight="700">元のmessage byte</text>
<text x="890" y="244" font-size="21">長さ ＋ 全byte列</text>
<text x="890" y="292" font-size="19">空・埋め込みNUL・非UTF8</text>
<text x="890" y="337" font-size="19">C文字列に変換しない</text>
<text x="890" y="407" font-size="19">人工30結果を独立仕様と比較</text>
<text x="890" y="441" font-size="19">元の26,194byteを照合</text>
<path d="M72 585 H1208" stroke="#4b799c"/>
<text x="48" y="627" font-size="20" fill="#c2d4e7">取得時の再capture・query・数値計算なし。停止・例外・再入でも原値を変更しない。</text>
<text x="48" y="674" font-size="18" fill="#9db7d2">原著の診断保存教材。実prepareの正しさ、全Report、WASM・ゲーム接続は別の検証。</text>
</g>
</svg>
