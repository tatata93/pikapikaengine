<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="550" viewBox="0 0 1040 550" role="img" aria-labelledby="title desc">
<title id="title">plane boxの元入力とSnapshotを保存する</title><desc id="desc">元の球と平面、宣言された位置誤差Bと接触余裕をそのままInputに保存し、元の秒と設定を加えたSnapshotも取得する。取得時に誤差や法線、tubeを計算しない。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#6ce1ce"/></marker></defs>
<rect width="1040" height="550" rx="20" fill="#101b2b"/>
<g font-family="sans-serif" fill="#edf5ff"><text x="36" y="47" font-size="27" font-weight="700">宣言された誤差と、元入力を残す</text><text x="36" y="79" font-size="16" fill="#b9cadf">原著の保存範囲の概念図 · 実軌道の包含や数値モデルの認証を示す図ではありません</text></g>
<g fill="#20334b" stroke="#416284" stroke-width="1.5"><rect x="36" y="112" width="270" height="130" rx="12"/><rect x="36" y="264" width="270" height="130" rx="12"/><rect x="390" y="112" width="270" height="282" rx="12"/><rect x="744" y="112" width="260" height="282" rx="12"/></g>
<g font-family="sans-serif" fill="#edf5ff" font-size="17"><text x="55" y="145" font-size="21" font-weight="700">元のsphere</text><text x="55" y="181">位置・速度・加速度</text><text x="55" y="215">元の半径</text><text x="55" y="297" font-size="21" font-weight="700">元のplane</text><text x="55" y="333">raw法線・offset</text><text x="55" y="367" fill="#6ce1ce">正規化せず全bitを保持</text><text x="409" y="145" font-size="21" font-weight="700">Input · 全4項目</text><text x="409" y="186">sphere / plane</text><text x="409" y="228" fill="#6ce1ce">position_error</text><text x="409" y="257">各軸に宣言されたBの原値</text><text x="409" y="304" fill="#ffcf91">contact_margin</text><text x="409" y="333">明示された接触余裕</text><text x="409" y="370" font-size="15">値の役割と名前を分けて保存</text><text x="763" y="145" font-size="21" font-weight="700">Snapshot · 全3項目</text><text x="763" y="190">input 全体</text><text x="763" y="235">horizon 元の秒</text><text x="763" y="280">settings 全設定</text><text x="763" y="331" fill="#6ce1ce">const取得 → 型付きbyte列</text><text x="763" y="367" font-size="15">不正入力の保存と認証を区別</text></g>
<g stroke="#6ce1ce" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M306 177H347V190H380"/><path d="M306 329H347V221H380"/><path d="M660 253H734"/></g>
<rect x="36" y="422" width="968" height="85" rx="12" fill="#153a3a" stroke="#3c8f83"/><g font-family="sans-serif" fill="#d5fff3" font-size="18"><text x="55" y="455" font-weight="700">取得時に B の推定・半径の膨張・tube の再計算を行わない</text><text x="55" y="486" font-size="16">負零・非有限値・全64bit計数も原値で比較する · 人工診断の保存試験として検証</text></g>
</svg>
