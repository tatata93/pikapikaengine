<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
<title id="title">貫通開始窓の全診断をJavaScriptで所有する</title>
<desc id="desc">全6能力と一度captureした原本を確認してから共有SDKへ渡す。各getter前後にcopyし、原入力、Native snapshot、lastMesh、旧結果と次の結果を分離する。初期点や全partition/tailも省略しない。原著概念図で性能や数学包含の測定ではない。</desc>
<rect width="1000" height="620" rx="18" fill="#101d29"/>
<g font-family="sans-serif" fill="#e5f1f7">
<text x="30" y="44" font-size="25">貫通開始窓の全診断を、JavaScriptで所有する</text>
<text x="30" y="77" font-size="16" fill="#9cb5c8">全6能力を先に確認 / 原入力を一度capture / 共有scratchから毎回copy</text>
<rect x="28" y="106" width="282" height="130" rx="12" fill="#193044" stroke="#527d9b"/>
<text x="48" y="141" font-size="20">callerの原本</text>
<text x="48" y="178" font-size="17">endpoint / source / 設定</text>
<text x="48" y="211" font-size="17">検査値と送信値を揃える</text>
<path d="M316 172 H345" stroke="#87cbd8" stroke-width="4"/>
<rect x="351" y="106" width="296" height="130" rx="12" fill="#193b40" stroke="#66aaa4"/>
<text x="371" y="141" font-size="20">共有C++ / WASM</text>
<text x="371" y="178" font-size="17">独立entry recordと有界getter</text>
<text x="371" y="211" font-size="17">全fieldをcopyして検査</text>
<path d="M654 172 H683" stroke="#87cbd8" stroke-width="4"/>
<rect x="690" y="106" width="282" height="130" rx="12" fill="#193044" stroke="#527d9b"/>
<text x="710" y="141" font-size="20">所有DTO</text>
<text x="710" y="178" font-size="17">originalInputとsnapshotも別</text>
<text x="710" y="211" font-size="17">旧結果・次結果と共有しない</text>
<rect x="28" y="263" width="944" height="124" rx="12" fill="#25344b" stroke="#7385ac"/>
<text x="48" y="299" font-size="19">initial proof / 全256audit / 全128partition・frontier・未照会tail</text>
<text x="48" y="332" font-size="17">安全prefix・後方の証明島・bestWitness・外向き窓幅・全source候補ID</text>
<text x="48" y="365" font-size="17">lastMesh全行/候補とaudit所属、Work exactと保守上限、実原本と負零</text>
<rect x="28" y="414" width="944" height="103" rx="12" fill="#263a35" stroke="#74aa8d"/>
<text x="48" y="448" font-size="20">実owned DTO → Native全bits一致 → 出自付きmixed数学参照</text>
<text x="48" y="482" font-size="17">host拒否をモデル実行と数えない。metadataの検査と幾何の証明は分ける。</text>
<text x="30" y="552" font-size="17" fill="#ffc997">能力/入力拒否は書込0。Native commit後のdecoder拒否は巻き戻しを約束しない。</text>
<text x="30" y="587" font-size="15" fill="#9cb5c8">原著概念図。固定例のAPI検証と、手動UI / World / 接触応答への接続は別段階。</text>
</g></svg>
