<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="title description">
<title id="title">二つの界面で偏光を引き継ぐ</title>
<desc id="description">無偏光の入射光はBrewster条件で反射するとs偏光だけが残る。次の面が同じ入射面ならRsの二乗の半分のパワーになり、入射面を90度回すとp成分になってBrewster反射が消える。各面で無偏光に戻して平均しない。</desc>
<rect width="1000" height="360" rx="16" fill="#0c1825"/>
<g fill="none" stroke="#87dece" stroke-width="3"><path d="M215 150H285M515 150H585M515 150V278H585"/><path d="m276 143 9 7-9 7m300-14 9 7-9 7m-9 121 9 7-9 7"/></g>
<g fill="#162b3c" stroke="#6a879d"><rect x="25" y="88" width="190" height="125" rx="12"/><rect x="285" y="88" width="230" height="125" rx="12"/><rect x="585" y="60" width="390" height="125" rx="12"/><rect x="585" y="215" width="390" height="105" rx="12"/></g>
<g font-family="system-ui,sans-serif" fill="#e8f0f7" font-size="19">
<text x="25" y="35" font-size="25">偏光の成分は、光線の基底と一緒に運ぶ</text>
<text x="45" y="122">無偏光の入射</text><text x="45" y="155">I = 1</text><text x="45" y="188">s : p = 1 : 1</text>
<text x="305" y="122">第1面：Brewster条件</text><text x="305" y="155">反射は s だけ</text><text x="305" y="188">I = Rₛ / 2</text>
<text x="605" y="94">第2面：同じ入射面</text><text x="605" y="127">入射 s → 反射 I = Rₛ² / 2</text><text x="605" y="160" font-size="16" fill="#ffca85">無偏光へ戻して平均すると別の結果</text>
<text x="605" y="249">第2面：入射面を90°回す</text><text x="605" y="284">入射 p → Brewster反射は 0</text>
<text x="25" y="345" font-size="16" fill="#abc2d4">自作の概念図。各面nᵢ=1, nₜ=1.5、Rₛ=25/169。幾何配置と幅は模式的で、性能や画像品質の測定ではない。</text>
</g></svg>
