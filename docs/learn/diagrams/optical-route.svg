<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-labelledby="title desc"><title id="title">主光路と二回反射の指定経路</title><desc id="desc">n1.5で厚さ0.25mの平板。主光路距離2.25m、光学距離2.375m、パワー比0.9216。内部二回反射経路は距離2.75m、光学距離3.125m、パワー比0.00147456。</desc><rect width="1000" height="380" rx="16" fill="#101a28"/><g font-family="sans-serif" fill="#e1eaf5" font-size="20"><text x="30" y="36">同じ平板でも、選んだ面列が違えば光路長と減衰が変わる</text><rect x="250" y="72" width="220" height="244" fill="#243e55"/><path d="M250 65V325M470 65V325M650 65V325" stroke="#91a5ba" stroke-width="2"/><path d="M65 116H650" stroke="#75d6ff" stroke-width="4" fill="none"/><path d="M65 220H470L250 270L470 300H650" stroke="#ffb97d" stroke-width="4" fill="none"/><text x="265" y="100">n=1.5</text><text x="268" y="348">厚さ0.25m</text><text x="540" y="348">センサー</text><text x="700" y="100" fill="#75d6ff">主光路 T → T</text><text x="700" y="136">距離 2.25 m</text><text x="700" y="167">OPL 2.375 m</text><text x="700" y="198">パワー比 0.9216</text><text x="700" y="248" fill="#ffb97d">T → R → R → T</text><text x="700" y="280">距離 2.75 m</text><text x="700" y="311">OPL 3.125 m</text><text x="700" y="342">比 0.00147456</text><text x="30" y="370" font-size="15" fill="#afc2d5">正常入射の独自解析例。反射経路は判別用に横へずらした模式図。T=透過、R=反射。干渉・全経路探索ではない。</text></g></svg>
