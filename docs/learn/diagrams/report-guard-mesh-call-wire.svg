<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="570" viewBox="0 0 1040 570" role="img" aria-labelledby="title desc">
<title id="title">World guard MeshCallの保存範囲</title><desc id="desc">元の状態と試行位置、異なる要求と使用設定、許可とGrant、返却結果または欠損、本文の省略計数を独立に保持する概念図。人工保存試験であり数値モデル認証ではない。</desc>
<rect width="1040" height="570" rx="20" fill="#101c2c"/>
<g font-family="sans-serif" fill="#edf5ff">
<text x="32" y="45" font-size="25" font-weight="700">呼出の元設定・許可・返却結果を、別々の値として保持する</text>
<text x="32" y="78" font-size="16" fill="#bdd1e8">原著の保存範囲の概念図 ／ 人工MeshCallの保存試験であり、数値モデル認証ではない</text>
<rect x="28" y="106" width="984" height="91" rx="14" fill="#193049" stroke="#719bc6"/>
<text x="49" y="141" font-size="22" font-weight="700">state ／ attempt_ordinal または欠損</text>
<text x="49" y="176" font-size="17">全child呼出通算の元の64bit位置を保存。保存順から試行順を作り直さない。</text>
<rect x="28" y="217" width="476" height="150" rx="14" fill="#173c3e" stroke="#86bdb7"/>
<rect x="525" y="217" width="487" height="150" rx="14" fill="#26364c" stroke="#719bc6"/>
<text x="49" y="254" font-size="22" font-weight="700">要求と実使用を区別</text>
<text x="49" y="294" font-size="18">requested_settings ／ used_settings</text><text x="49" y="337" font-size="16" fill="#bdd1e8">元の異なる値を、それぞれそのまま保持</text>
<text x="547" y="254" font-size="22" font-weight="700">許可と計算済みGrantを区別</text>
<text x="547" y="294" font-size="18">granted ／ grant</text><text x="547" y="337" font-size="16" fill="#bdd1e8">拒否時もgrantを残し、chargedへ置換しない</text>
<rect x="28" y="387" width="984" height="153" rx="14" fill="#292e48"/>
<text x="49" y="424" font-size="22" font-weight="700">result または欠損 ／ messages の元の省略計数</text>
<text x="49" y="464" font-size="18">返却された自由飛行Result全12項目を保持。欠損を再queryで埋めない。</text>
<text x="49" y="504" font-size="17" fill="#bdd1e8">省略済み本文を復元せず、fields・nonempty_fields・bytes・omittedを残す。</text>
</g></svg>
