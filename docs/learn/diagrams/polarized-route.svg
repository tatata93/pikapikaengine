<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc"><title id="title">異なる面へ偏光を引き継ぐ</title><desc id="desc">二つの傾いた面で反射する光線と横断面の基底。世界XYZの複素coherencyを保ち、幾何と偏光の失敗位置を分ける。</desc><rect width="1000" height="360" rx="16" fill="#101c2b"/><g font-family="system-ui,sans-serif" font-size="19" fill="#e6edf5"><text x="28" y="38">面が変わる → s/pの向きも変わる → 世界XYZで状態を引き継ぐ</text><path d="M70 265L300 145L570 218L790 92" fill="none" stroke="#7ee1d1" stroke-width="5"/><path d="M250 92L350 210M520 269L622 155" stroke="#a9baff" stroke-width="9"/><g stroke="#ffbf75" stroke-width="3"><path d="M165 183L183 225M151 214L202 193M420 177L438 220M409 211L454 187M685 124L708 169M678 157L724 137"/></g><text x="80" y="300">初期Stokes + 参照軸</text><text x="270" y="80">面1</text><text x="556" y="302">面2：入射面が回転</text><text x="718" y="68">C′ = J C J†</text><text x="678" y="217">実部・虚部を区間で保持</text><text x="678" y="246">全反射の位相差も保持</text><path d="M38 326H960" stroke="#42566d"/><text x="40" y="351" font-size="16">幾何の完了prefix ≠ 偏光の完了prefix。最終状態が未確定なら0や無偏光へ戻さない。</text></g></svg>
