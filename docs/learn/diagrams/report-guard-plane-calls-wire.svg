<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="570" viewBox="0 0 1040 570" role="img" aria-labelledby="title desc">
<title id="title">PlaneCallsの二つの呼出を保存する</title><desc id="desc">metricとboxの元の全Callを宣言順に保存する原著の概念図。各resultの存在と欠損は独立。元の試行位置と設定、Grant、全返却結果、省略計数を保持し、失敗前の送信済みprefixと失敗状態も保持する。</desc>
<rect width="1040" height="570" rx="20" fill="#101c2c"/>
<g font-family="sans-serif" fill="#edf5ff">
<text x="32" y="45" font-size="25" font-weight="700">PlaneCalls：二つの元の呼出を一組で保存</text>
<text x="32" y="78" font-size="16" fill="#bdd1e8">原著の保存範囲 ／ 人工診断値の保持と、実Worldの数値認証は別</text>
<rect x="28" y="106" width="984" height="75" rx="14" fill="#193049" stroke="#719bc6"/>
<text x="49" y="138" font-size="21" font-weight="700">metric → box の宣言順を保持</text>
<text x="49" y="166" font-size="16">両Callは常に存在し、それぞれのresultの存在／欠損を独立に保存する。</text>
<rect x="28" y="201" width="476" height="206" rx="14" fill="#173c3e" stroke="#86bdb7"/>
<rect x="525" y="201" width="487" height="206" rx="14" fill="#26364c" stroke="#719bc6"/>
<text x="49" y="239" font-size="22" font-weight="700">metric：PlaneMetricCall 全8項目</text>
<text x="49" y="280" font-size="18">元Input variant と全Resultまたは欠損</text>
<text x="49" y="321" font-size="16" fill="#bdd1e8">元の要求／使用設定、許可とGrant</text>
<text x="49" y="359" font-size="16" fill="#bdd1e8">全監査・区画・tail、省略計数を保持</text>
<text x="547" y="239" font-size="22" font-weight="700">box：PlaneBoxCall 全8項目</text>
<text x="547" y="280" font-size="18">元の宣言B・margin と全Resultまたは欠損</text>
<text x="547" y="321" font-size="16" fill="#bdd1e8">元の球・平面係数、要求／使用設定</text>
<text x="547" y="359" font-size="16" fill="#bdd1e8">許可とGrant、全監査・区画・省略計数</text>
<rect x="28" y="427" width="984" height="113" rx="14" fill="#292e48"/>
<text x="49" y="465" font-size="21" font-weight="700">元の試行位置 ／ 失敗前の送信済みprefixと失敗状態</text>
<text x="49" y="506" font-size="17" fill="#bdd1e8">保存順から試行順を作り直さず、返却済みの値を再計算しない。</text>
</g></svg>
