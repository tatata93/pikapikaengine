<svg xmlns="http://www.w3.org/2000/svg" width="800" height="240" viewBox="0 0 800 240" role="img" aria-labelledby="t d"><title id="t">正弦波の振幅・周期・位相</title><desc id="d">中心から山までが振幅A、山から次の山までが周期T。横軸は秒、縦軸はピクセル。</desc><rect width="800" height="240" rx="10" fill="#0d1723"/><g stroke="#638098" stroke-width="2"><path d="M80 115H750M80 35V195"/></g><path d="M80 115C110 115 115 55 155 55S200 115 230 115S265 175 305 175S350 115 380 115S415 55 455 55S500 115 530 115S565 175 605 175S650 115 680 115" fill="none" stroke="#7ee1d1" stroke-width="4"/><path d="M155 37H455M155 30V44M455 30V44M716 55V115M708 55H724M708 115H724" fill="none" stroke="#ffbf75" stroke-width="2"/><g fill="#e6edf5" font-family="sans-serif" font-size="18"><text x="240" y="28">周期 T = 1/f [s]</text><text x="610" y="44">振幅 A [px]</text><text x="680" y="145">t [s]</text><text x="15" y="28">x [px]</text><text x="25" y="122">0</text><text x="90" y="222">φ は時刻0の揺れの位置（角度）をずらす / 2π rad = 1周</text></g></svg>
