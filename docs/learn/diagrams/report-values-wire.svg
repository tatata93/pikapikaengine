<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="550" viewBox="0 0 1040 550">
<title>物理診断のbody・形状・荷重・時計を、そのまま取得する</title>
<desc>12種類44memberのNative値を、元順とbitを保って専用sinkへ写す概念図。全Report取得と物理モデルの完成は別。</desc>
<defs><style>text{font-family:system-ui,sans-serif;fill:#183248}.title{font-size:26px;font-weight:700}.head{font-size:21px;font-weight:700}.body{font-size:18px}.small{font-size:16px}</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#365c78" stroke-width="1.5"/></marker></defs>
<rect width="1040" height="550" rx="16" fill="#f1f6fa"/>
<text x="30" y="46" class="title">body・形状・荷重・時計を、補正せずに取り出す</text>
<text x="30" y="78" class="small">原著のNative値取得図。全Report / C API pump / WASM・ゲーム接続は未実装です。</text>
<rect x="30" y="108" width="295" height="210" rx="14" fill="#e5efff" stroke="#b8cbdf"/>
<text x="48" y="145" class="head">1 · 元の全memberを読む</text>
<text x="48" y="183" class="body">位置・姿勢・力・材料</text>
<text x="48" y="220" class="body">平面・三角形・mesh・packet</text>
<text x="48" y="257" class="small">12型 / 44member、元順の値</text>
<text x="48" y="290" class="small">診断の保存と物理の有効性は別</text>
<path d="M330 214H367" stroke="#365c78" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="377" y="108" width="285" height="210" rx="14" fill="#e5f5ec" stroke="#b0d2c0"/>
<text x="395" y="145" class="head">2 · 型とbitを残す</text>
<text x="395" y="183" class="body">F64 / U64 / bool / enum</text>
<text x="395" y="220" class="body">負零・NaN・全64bit ID</text>
<text x="395" y="257" class="small">空の配列もarrayとして保持</text>
<text x="395" y="290" class="small">World再照会・数値計算なし</text>
<path d="M667 214H704" stroke="#365c78" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="714" y="108" width="296" height="210" rx="14" fill="#fff0de" stroke="#ddc39e"/>
<text x="732" y="145" class="head">3 · 変更と失敗を確認</text>
<text x="732" y="183" class="body">header変更ならfield再確認</text>
<text x="732" y="220" class="body">sink停止・例外・再入を区別</text>
<text x="732" y="257" class="small">不完全なdocumentを公開しない</text>
<text x="732" y="290" class="small">全Reportの下位型は次の工程へ</text>
<rect x="30" y="344" width="980" height="173" rx="14" fill="white" stroke="#c5d3dd"/>
<text x="50" y="380" class="head">実MSVC Release / Debugの有限検証</text>
<text x="50" y="417" class="body">全3112 byte一致 / 96 F64 bit値 / 1042停止・例外 / 6252再入拒否</text>
<text x="50" y="451" class="body">独立264 byte改変＋3配列改変を拒否 / 実CMakeの11変更・欠落を拒否</text>
<text x="50" y="487" class="small">元12型は実GNU 13の通常 / Debug / ASan-UBSanも一致。新設定・全Reportは次段です。</text>
</svg>
