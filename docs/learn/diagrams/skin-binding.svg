<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="t d"><title id="t">スキン原本と共通計算</title><desc id="d">全メッシュ、著者の重み、inverse bind、rest snapshot、motionを一つの原本へ保存する。JSONとportableを往復し、全Scene形状とrestを照合して共通C++の位置を得る。</desc><rect width="960" height="360" rx="18" fill="#101d29"/><g font-family="system-ui,sans-serif" fill="#e1eaf2"><text x="28" y="38" font-size="21">原本を保持し、照合してから位置を求める</text><g fill="#1a2b3b" stroke="#7ee1d1"><rect x="30" y="72" width="250" height="218" rx="10"/><rect x="342" y="72" width="250" height="218" rx="10"/><rect x="654" y="72" width="276" height="218" rx="10"/></g><g font-size="18"><text x="48" y="105">所有する原本</text><text x="360" y="105">読込・照合</text><text x="672" y="105">共通C++の照会</text></g><g font-size="15" fill="#bdd0df"><text x="48" y="140">全meshと順序</text><text x="48" y="168">全author weight / inverse</text><text x="48" y="196">bind時の親・local rest</text><text x="48" y="224">全motion / 安定ID</text><text x="48" y="263">JSON ⇄ portable ⇄ Native</text><text x="360" y="140">重複key / 予算 / Unicode</text><text x="360" y="168">全Scene形状の一致</text><text x="360" y="196">全rest snapshotの一致</text><text x="360" y="224">hashだけで省略しない</text><text x="360" y="263">原本は正規化で上書きしない</text><text x="672" y="140">rest FKとstored rest</text><text x="672" y="168">現在のFK → 頂点deform</text><text x="672" y="196">失敗時は位置を返さない</text><text x="672" y="224">原本保存と数値成功は別</text><text x="672" y="263">GPU / 法線 / 接触は後段</text></g><text x="30" y="331" font-size="14" fill="#ffbf75">同じ内容の重複頂点の概念的入替・履歴は識別しない。点計算であり一般の誤差包含ではない。</text></g><path d="M290 180h40m-9-8 9 8-9 8m281-8h40m-9-8 9 8-9 8" fill="none" stroke="#7ee1d1" stroke-width="3"/></svg>
